services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novaforge
      POSTGRES_PASSWORD: novaforge
      POSTGRES_DB: novaforge
    ports:
      - "5432:5432"
    volumes:
      - novaforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  novaforge_pgdata:
